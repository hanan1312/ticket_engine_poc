# nginx site: public port 80 (and 443 after certbot) -> gunicorn on 127.0.0.1:4044.
# Install: sudo cp deploy/nginx-ticket-engine.conf /etc/nginx/sites-available/ticket-engine
#          sudo ln -s /etc/nginx/sites-available/ticket-engine /etc/nginx/sites-enabled/
#          sudo rm -f /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx
# Then HTTPS (needs a domain name pointing at the server):
#          sudo certbot --nginx -d your.domain.com
upstream ticket_engine {
    server 127.0.0.1:4044;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    # Replace with your domain (needed for certbot). "_" answers on any name / the bare IP.
    server_name _;

    # Logo (2 MB) and employee photo (3 MB) uploads, with headroom.
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://ticket_engine;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;   # matches gunicorn's timeout (PDFs)
    }
}
